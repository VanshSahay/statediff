<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>statediff — live block state diffs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe8; --surface: #faf7f3; --text: #2c2825; --muted: #8a8278;
    --accent: #3d7068; --accent-hover: #2a544d; --border: #e5ded5;
    --radius: 4px; --pos: #3d7068; --neg: #a4443c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 18px; -webkit-font-smoothing: antialiased; background: var(--bg); }
  body { font-family: "Fraunces", Georgia, serif; color: var(--text); line-height: 1.65; min-height: 100vh; }
  main { max-width: 860px; margin: 0 auto; padding: 3rem 1.5rem 3rem; }
  h1 { font-size: 2.6rem; font-weight: 400; letter-spacing: -0.015em; line-height: 1.1; margin-bottom: 0.35rem; text-align: center; }
  .subtitle { color: var(--muted); margin-bottom: 1.5rem; max-width: 52ch; margin-left: auto; margin-right: auto; text-align: center; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0 1.75rem; }
  .section-label { font-size: 0.8rem; color: var(--muted); font-style: italic; margin-bottom: 0.75rem; }
  .controls { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.5rem; justify-content: center; }
  input { font-family: "JetBrains Mono", monospace; font-size: 0.75rem; background: var(--surface);
    border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); padding: 0.5rem 0.7rem; flex: 1; min-width: 240px; max-width: 420px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font-family: "JetBrains Mono", monospace; font-size: 0.7rem; font-weight: 500; cursor: pointer;
    border-radius: var(--radius); padding: 0.5rem 1rem; letter-spacing: 0.02em; }
  #connect { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
  #connect:hover { background: var(--accent-hover); }
  #stop { background: none; color: var(--muted); border: 1px solid var(--border); }
  #stop:hover { color: var(--text); border-color: var(--muted); }
  #status { font-family: "JetBrains Mono", monospace; font-size: 0.7rem; color: var(--muted);
    padding: 0.5rem 0; margin-bottom: 0.25rem; min-height: 1.6em; text-align: center; }
  #status.err { color: var(--neg); }
  #chain { overflow-x: auto; padding: 0.5rem 0.25rem 0.75rem; scrollbar-width: thin; }
  #chain-inner { display: flex; align-items: stretch; gap: 0.4rem; width: max-content; margin: 0 auto; }
  .card { min-width: 132px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0.6rem 0.8rem; cursor: pointer; transition: border-color 0.2s ease, transform 0.2s ease; user-select: none; }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card.live { border-color: var(--accent); }
  .card-num { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 0.25rem; }
  .card-stats { font-family: "JetBrains Mono", monospace; font-size: 0.62rem; color: var(--muted); line-height: 1.5; }
  .arrow { align-self: center; color: var(--muted); font-family: "JetBrains Mono", monospace; font-size: 1.1rem; user-select: none; }
  .empty { font-family: "JetBrains Mono", monospace; font-size: 0.7rem; color: var(--muted); padding: 1rem 0; text-align: center; }
  #block-view { display: none; }
  body.in-block #chain-view { display: none; }
  body.in-block #block-view { display: block; }
  .section-label { text-align: left; }
  #block-view .box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.5rem 1.75rem; }
  #back { background: none; color: var(--muted); border: 1px solid var(--border); margin: 0 0 1rem; }
  #back:hover { color: var(--text); border-color: var(--muted); }
  .detail-head { font-family: "JetBrains Mono", monospace; font-size: 0.72rem; color: var(--muted); margin-bottom: 0.3rem; }
  .diff { font-family: "JetBrains Mono", monospace; font-size: 0.72rem; margin-bottom: 1.5rem; }
  .diff .pos { color: var(--pos); }
  .diff .neg { color: var(--neg); }
  .tx-row { display: flex; gap: 0.6rem; align-items: baseline; font-family: "JetBrains Mono", monospace; font-size: 0.68rem;
    padding: 0.35rem 0; border-bottom: 1px dotted var(--border); }
  .tx-idx { color: var(--muted); min-width: 2.2em; }
  .tx-hash { color: var(--text); }
  .tx-path { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx-path .arrow { color: var(--border); }
  .tx-value { color: var(--text); }
  .tx-type { font-size: 0.6rem; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; color: var(--muted); }
  .tx-new { color: var(--pos); }
  .verified { color: var(--pos); }
  .unverified { color: var(--neg); }
  .netflow { display: flex; gap: 2rem; flex-wrap: wrap; font-family: "JetBrains Mono", monospace; font-size: 0.68rem; margin-bottom: 1rem; }
  .netflow .col { flex: 1; min-width: 200px; }
  .netflow .row { display: flex; justify-content: space-between; padding: 0.15rem 0; border-bottom: 1px dotted var(--border); }
  .netflow .gain { color: var(--pos); }
  .netflow .loss { color: var(--neg); }
  .spark { margin: 0.15rem 0 0.4rem 1.1rem; }
  .bal-sum { font-size: 0.8rem; color: var(--muted); font-style: italic; margin: 1.25rem 0 0.6rem; }
  .txgroup { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg);
    padding: 0.5rem 0.8rem; margin-bottom: 0.5rem; }
  .txgroup-head { font-family: "JetBrains Mono", monospace; font-size: 0.65rem; color: var(--muted); margin-bottom: 0.3rem; }
  .txgroup-head .sys { color: var(--muted); font-style: italic; }
  .acct-row { font-family: "JetBrains Mono", monospace; font-size: 0.68rem; padding: 0.15rem 0; display: flex; gap: 0.5rem; align-items: baseline; flex-wrap: wrap; }
  .acct-addr { color: var(--text); }
  .chip { font-size: 0.62rem; border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; background: var(--surface); }
</style>
</head>
<body>
<main>
  <h1>statediff</h1>
  <p class="subtitle">live block state diffs, straight from the chain's block access list</p>
  <div class="controls">
    <input id="rpc" placeholder="https://…trycloudflare.com — devnet RPC">
    <button id="connect">Connect</button>
    <button id="stop">Stop</button>
  </div>
  <div id="status">idle</div>
  <hr class="divider">
  <div id="chain-view">
    <p class="section-label">Chain</p>
    <div id="chain"><div id="chain-inner"><div class="empty">waiting for blocks…</div></div></div>
    <p class="section-label" id="flow-label" style="display:none">Net flow since connect</p>
    <div id="netflow"></div>
  </div>
  <div id="block-view">
    <button id="back">← back</button>
    <div class="box" id="detail-body"></div>
  </div>
</main>

<script src="wasm_exec.js"></script>
<script>
const chainInner = document.getElementById("chain-inner");
const detailBody = document.getElementById("detail-body");
const netflowEl = document.getElementById("netflow");
const flowLabel = document.getElementById("flow-label");
let blocks = [];
const balanceHistory = new Map();

const systemContracts = {
  "0x000f3df6d732807ef1319fb7b8bb8522d0beac02": "beacon-roots (EIP-4788)",
  "0x0000f90827f1c53a10cb7a02335b175320002935": "blockhash-history (EIP-2935)",
};
const hex2dec = h => parseInt(h, 16);
const weiToEth = h => (Number(BigInt(h) / 1000000000000n) / 1000000).toFixed(6);
const short = a => a.length <= 12 ? a : a.slice(0, 8) + "…" + a.slice(-4);
const signed = n => (n > 0 ? "+" : "") + n;

function stateDiffBlock(json) {
  const ev = JSON.parse(json);
  blocks.push(ev);
  recordBalances(ev);
  renderChain();
  updateNetFlow();
}

function recordBalances(ev) {
  for (const acct of ev.bal || []) {
    if (!acct.balanceChanges.length) continue;
    const last = acct.balanceChanges[acct.balanceChanges.length - 1];
    const hist = balanceHistory.get(acct.address) || [];
    hist.push({ block: hex2dec(ev.number), bal: BigInt(last.value) });
    balanceHistory.set(acct.address, hist);
  }
}

function updateNetFlow() {
  const rows = [];
  for (const [addr, hist] of balanceHistory) {
    if (hist.length < 2) continue;
    const delta = hist[hist.length - 1].bal - hist[0].bal;
    if (delta !== 0n) rows.push({ addr, delta });
  }
  if (!rows.length) { netflowEl.innerHTML = ""; flowLabel.style.display = "none"; return; }
  rows.sort((a, b) => Number(b.delta - a.delta));
  flowLabel.style.display = "";
  const top = rows.slice(0, 4), bottom = rows.slice(-4).reverse();
  const fmt = d => (Number(d / 1000000000000n) / 1000000).toFixed(4);
  const col = (list, cls) => list.map(r =>
    `<div class="row"><span>${short(r.addr)}</span><span class="${cls}">${r.delta > 0n ? "+" : ""}${fmt(r.delta)} Ξ</span></div>`).join("");
  netflowEl.innerHTML =
    `<div class="netflow"><div class="col"><div class="dim">gained</div>${col(top, "gain")}</div>` +
    `<div class="col"><div class="dim">lost</div>${col(bottom, "loss")}</div></div>`;
}

function sparkline(addr) {
  const hist = balanceHistory.get(addr);
  if (!hist || hist.length < 2) return "";
  const vals = hist.map(h => h.bal);
  let min = vals[0], max = vals[0];
  for (const v of vals) { if (v < min) min = v; if (v > max) max = v; }
  const span = max - min || 1n;
  const pts = vals.map((v, i) =>
    `${(i / (vals.length - 1) * 120).toFixed(1)},${(28 - Number((v - min) * 28n / span)).toFixed(1)}`).join(" ");
  return `<svg width="120" height="28" viewBox="0 0 120 28"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
}

function renderChain() {
  const chain = document.getElementById("chain");
  const atEnd = chain.scrollLeft + chain.clientWidth >= chain.scrollWidth - 8;
  const prevScroll = chain.scrollLeft;
  chainInner.innerHTML = "";
  if (blocks.length === 0) {
    chainInner.innerHTML = '<div class="empty">waiting for blocks…</div>';
    return;
  }
  for (let i = 0; i < blocks.length; i++) {
    const ev = blocks[i];
    const card = document.createElement("div");
    card.className = "card" + (i === blocks.length - 1 ? " live" : "");
    card.innerHTML =
      `<div class="card-num">${hex2dec(ev.number)}</div>` +
      `<div class="card-stats">${ev.txs.length} txs · ${signed(ev.timeDelta)}s<br>${ev.newContracts} new</div>`;
    card.onclick = () => openBlock(ev);
    chainInner.appendChild(card);
    if (i < blocks.length - 1) {
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "→";
      chainInner.appendChild(arrow);
    }
  }
  if (atEnd) chain.scrollLeft = chain.scrollWidth;
  else chain.scrollLeft = prevScroll;
}

function openBlock(ev) {
  renderDetail(ev);
  document.body.classList.add("in-block");
  window.scrollTo(0, 0);
}

function renderDetail(ev) {
  const txs = ev.txs || [];
  const bal = ev.bal || [];

  let txRows = "";
  for (let i = 0; i < txs.length; i++) {
    const tx = txs[i];
    const val = tx.value && tx.value !== "0x0" ? ` <span class="tx-value">Ξ${weiToEth(tx.value)}</span>` : "";
    const path = tx.to
      ? `<span class="tx-path">${short(tx.from)} <span class="arrow">→</span> ${short(tx.to)}</span>`
      : `<span class="tx-path">${short(tx.from)} <span class="arrow">→</span> <span class="tx-new">contract</span></span>`;
    txRows += `<div class="tx-row"><span class="tx-idx">#${i}</span><span class="tx-hash">${short(tx.hash)}</span>${path}${val}<span class="tx-type">t${hex2dec(tx.type || "0x0")}</span></div>`;
  }

  let userCount = 0, systemCount = 0;
  const groups = new Map();
  for (const acct of bal) {
    const chips = [];
    for (const bc of acct.balanceChanges) chips.push({ idx: bc.index, text: `balance → ${weiToEth(bc.value)} ETH` });
    for (const nc of acct.nonceChanges) chips.push({ idx: nc.index, text: `nonce → ${hex2dec(nc.value)}` });
    for (const sc of acct.storageChanges) {
      const label = (ev.slotLabels || {})[acct.address + ":" + sc.key];
      for (const chg of sc.changes) {
        const prefix = label ? `[${label}] ` : "";
        chips.push({ idx: chg.index, text: prefix + `slot ${short(sc.key)} = ${short(chg.value)}` });
      }
    }
    for (const cc of acct.codeChanges) {
      const size = Math.max(0, cc.code.length / 2 - 1);
      chips.push({ idx: cc.index, text: `code deployed · ${size} bytes · ${short(cc.code)}` });
    }
    if (!chips.length) continue;

    const isSystem = systemContracts[acct.address];
    if (isSystem) systemCount++; else userCount++;

    for (const c of chips) {
      const n = hex2dec(c.idx);
      if (!groups.has(n)) groups.set(n, []);
      groups.get(n).push({ acct: acct.address, label: isSystem, text: c.text });
    }
  }
  let balHTML = "";
  const sorted = [...groups.keys()].sort((a, b) => a - b);
  for (const n of sorted) {
    const entries = groups.get(n);
    let head;
    if (n === 0) head = `<span class="sys">pre-execution system calls</span>`;
    else if (n === txs.length + 1) head = `<span class="sys">post-execution system calls</span>`;
    else head = `tx #${n}` + (txs[n - 1] ? ` · ${short(txs[n - 1].hash)}` : "");
    balHTML += `<div class="txgroup"><div class="txgroup-head">${head}</div>`;
    for (const e of entries) {
      const addr = e.label || short(e.acct);
      const spark = balanceHistory.has(e.acct) && balanceHistory.get(e.acct).length > 1
        ? `<div class="acct-row"><span class="dim" style="cursor:pointer" onclick="toggleSpark(this,'${e.acct}')">${addr} ▸ balance history</span></div>`
        : "";
      balHTML += `<div class="acct-row"><span class="acct-addr">${addr}</span><span class="chip">${e.text}</span></div>${spark}`;
    }
    balHTML += `</div>`;
  }

  const badge = ev.balVerified
    ? ` <span class="verified">✓ BAL verified (${(ev.balRlpBytes / 1024).toFixed(1)} KB RLP vs header)</span>`
    : (ev.bal ? ` <span class="unverified">✗ BAL hash mismatch</span>` : "");

  detailBody.innerHTML =
    `<div class="detail-head">block ${hex2dec(ev.number)} · ${short(ev.hash)} · +${ev.timeDelta}s${badge}</div>` +
    `<div class="diff">gas <span class="${ev.gasDelta >= 0 ? "pos" : "neg"}">${signed(ev.gasDelta)}</span>` +
    ` · txs <span class="pos">+${ev.txAdded}</span> <span class="neg">-${ev.txRemoved}</span>` +
    ` · new contracts ${ev.newContracts}</div>` +
    `<p class="section-label">Transactions (${txs.length})</p>${txRows || '<div class="empty">no transactions</div>'}` +
    `<p class="section-label">State changes by transaction (block access list)</p>` +
    `<div class="bal-sum">${userCount} user accounts · ${systemCount} system contracts</div>` +
    (balHTML || '<div class="empty">no state changes</div>');
}

function toggleSpark(elm, addr) {
  if (elm._spark) {
    elm._spark.remove();
    elm._spark = null;
    return;
  }
  const box = document.createElement("div");
  box.className = "spark";
  box.innerHTML = sparkline(addr);
  elm.parentNode.appendChild(box);
  elm._spark = box;
}

function stateDiffStatus(text) {
  const s = document.getElementById("status");
  s.textContent = text;
  s.classList.remove("err");
}
function stateDiffError(text) {
  const s = document.getElementById("status");
  s.textContent = "⚠ " + text;
  s.classList.add("err");
}

document.getElementById("rpc").value = localStorage.getItem("statediff-rpc") || "";
document.getElementById("connect").onclick = () => {
  const url = document.getElementById("rpc").value.trim();
  if (!url) return stateDiffError("enter an RPC URL");
  localStorage.setItem("statediff-rpc", url);
  statediff.start(url);
};
document.getElementById("stop").onclick = () => statediff.stop();
document.getElementById("back").onclick = () => document.body.classList.remove("in-block");

(async () => {
  const go = new Go();
  const buf = await fetch("statediff.wasm").then(r => r.arrayBuffer());
  const { instance } = await WebAssembly.instantiate(buf, go.importObject);
  go.run(instance);
  try {
    const r = await fetch("https://raw.githubusercontent.com/VanshSahay/go-ethereum/bal-devnet/devnet/current-url.json");
    const data = await r.json();
    if (data.rpc) {
      document.getElementById("rpc").value = data.rpc;
      localStorage.setItem("statediff-rpc", data.rpc);
      stateDiffStatus("latest devnet RPC loaded · connecting…");
      statediff.start(data.rpc);
    } else {
      stateDiffStatus("no devnet running — enter an RPC URL");
    }
  } catch (e) {
    stateDiffStatus("couldn't auto-fetch RPC — enter it manually");
  }
})();
</script>
</body>
</html>
